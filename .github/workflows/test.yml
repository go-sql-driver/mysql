name: test
on:
  pull_request:
  push:
  workflow_dispatch:

env:
  MYSQL_TEST_USER: gotest
  MYSQL_TEST_PASS: secret
  MYSQL_TEST_ADDR: 127.0.0.1:3306
  MYSQL_TEST_CONCURRENT: 1

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Staticcheck v0.8.1 cannot read Go 1.27 export data.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
          version: 'v0.8.1'

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: list
        id: set-matrix
        run: |
          import json
          import os
          go = [
              # Keep the most recent production release at the top
              '1.27',
              # Older production releases
              '1.26',
              '1.25',
          ]
          mysql = [  # LTS versions
              '9.7',
              '8.4',
              '8.0',
              'mariadb-12.3',
              'mariadb-11.8',
              'mariadb-11.4',
              'mariadb-10.11',
          ]

          includes = []
          # Go versions compatibility check
          for v in go[1:]:
              includes.append({'os': 'ubuntu-latest', 'go': v, 'mysql': mysql[0]})

          matrix = {
              # OS vs MySQL versions
              'os': [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ],
              'go': [ go[0] ],
              'mysql': mysql,

              'include': includes
          }
          output = json.dumps(matrix, separators=(',', ':'))
          with open(os.environ["GITHUB_OUTPUT"], 'a', encoding="utf-8") as f:
              print(f"matrix={output}", file=f)
        shell: python
  test:
    needs: list
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - uses: shogo82148/actions-setup-mysql@v1.54.2
        with:
          mysql-version: ${{ matrix.mysql }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASS }}
          my-cnf: |
            innodb_buffer_pool_size=512MB
            max_allowed_packet=48MB
            ; TestConcurrent fails if max_connections is too large
            max_connections=50
            local_infile=1
            performance_schema=on
      - name: setup database
        run: |
          mysql --user 'root' --host '127.0.0.1' -e 'create database gotest;'

      - name: test
        env:
          MYSQL_ZSTD_TEST_DSN: "${{ env.MYSQL_TEST_USER }}:${{ env.MYSQL_TEST_PASS }}@tcp(${{ env.MYSQL_TEST_ADDR }})/gotest?compress=true"
        run: |
          go test -v '-race' '-covermode=atomic' '-coverprofile=coverage.out' -parallel 10 ./...

      - name: benchmark
        run: |
          go test -run '^$' -bench .

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.3
        with:
          path-to-profile: coverage.out
          flag-name: ${{ runner.os }}-Go-${{ matrix.go }}-DB-${{ matrix.mysql }}
          parallel: true

  # notifies that all test jobs are finished.
  finish:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1.11.3
        with:
          parallel-finished: true
